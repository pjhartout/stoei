version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - godot # doc comments end with a period (consistent docstrings)
    - govet
    - ineffassign
    - staticcheck # includes ST1020/ST1021: doc comments start with the name
    - unused
    - depguard

  settings:
    godot:
      scope: declarations
    depguard:
      # Enforce the one-way layering ui -> store -> slurm.
      #
      #   * internal/ui/... must NOT import internal/slurm directly; it goes
      #     through internal/store.
      #   * internal/store must NOT import internal/ui.
      #   * internal/slurm must NOT import internal/ui or internal/store.
      #
      # store is allowed to import slurm, which is why there is no rule denying
      # that edge.
      rules:
        ui-not-slurm:
          files:
            - "**/internal/ui/**"
          deny:
            - pkg: github.com/pjhartout/stoei/internal/slurm
              desc: "ui must go through internal/store, not import internal/slurm directly"
        store-no-ui:
          files:
            - "**/internal/store/**"
          deny:
            - pkg: github.com/pjhartout/stoei/internal/ui
              desc: "store must not import ui; the dependency flows ui -> store"
        slurm-no-upper-layers:
          files:
            - "**/internal/slurm/**"
          deny:
            - pkg: github.com/pjhartout/stoei/internal/ui
              desc: "slurm is the lowest layer and must not import ui"
            - pkg: github.com/pjhartout/stoei/internal/store
              desc: "slurm is the lowest layer and must not import store"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
