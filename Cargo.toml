[package]
name = "stoei"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "A lightweight terminal UI for monitoring Slurm jobs"
license = "MIT"
repository = "https://github.com/pjhartout/stoei"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "use-dev-tty"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1"
signal-hook = { version = "0.3", default-features = false }
tar = { version = "0.4", default-features = false }
tempfile = "3"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
