name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked -- --nocapture
      - name: Install musl compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          export STOEI_VERSION="${GITHUB_REF_NAME#v}"
          export CC=musl-gcc
          cargo build --release --locked --target "${{ matrix.target }}"
          "./target/${{ matrix.target }}/release/stoei" --version
      - name: Package tarball
        shell: bash
        run: |
          mkdir -p dist package
          cp "target/${{ matrix.target }}/release/stoei" LICENSE README.md package/
          tar -czf "dist/stoei_${GITHUB_REF_NAME#v}_linux_${{ matrix.arch }}.tar.gz" -C package stoei LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: stoei-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stoei-*
          merge-multiple: true
          path: dist
      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum stoei_* > checksums.txt
          gh release create "$GITHUB_REF_NAME" stoei_* checksums.txt --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
